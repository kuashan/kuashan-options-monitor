name: SPY Four-Leg Capital & Tail Risk Check
on:
  push:
    branches:
      - research/spy-four-leg-capital-risk-v1
    paths:
      - research/four_leg_score/spy_three_regime_payoff.py
      - research/four_leg_score/test_capital_risk_reference.py
      - .github/workflows/spy-four-leg-capital-risk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB only
        run: python -m pip install 'duckdb>=1.1,<2'
      - name: Verify math/risks and existing research regression
        run: python -m unittest discover -s research/four_leg_score -p 'test_*.py' -v
      - name: Run same 2022-24 historical sample with normalized risk
        run: python -m research.four_leg_score.spy_three_regime_payoff
      - name: Archive reproducible full result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-four-leg-capital-risk-result
          path: spy_four_leg_capital_risk_result.json
          if-no-files-found: ignore
