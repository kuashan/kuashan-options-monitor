name: Frozen V1 SPY Four-Year Accuracy Audit
on:
  push:
    branches:
      - research/options-v1-spy-accuracy-audit
    paths:
      - research/four_leg_score/spy_v1_score_accuracy_audit.py
      - .github/workflows/spy-v1-accuracy-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB only for historical Parquet audit
        run: python -m pip install 'duckdb>=1.1,<2'
      - name: Regression tests of V1 formula and four-leg research assumptions
        run: |
          python -m unittest discover -s research/four_leg_score -p 'test_*.py' -v
          python -m unittest discover -s standalone_web/tests -p 'test_*.py' -v
      - name: Audit FROZEN V1 score on SPY 2022 to 2025
        run: python -m research.four_leg_score.spy_v1_score_accuracy_audit
      - name: Archive complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-v1-four-year-score-accuracy
          path: spy_v1_score_accuracy_audit.json
          if-no-files-found: ignore
