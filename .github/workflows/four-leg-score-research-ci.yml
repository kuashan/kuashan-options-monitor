name: Four-leg options scoring research tests
on:
  push:
    branches:
      - research/four-leg-score-v1
    paths:
      - 'research/four_leg_score/**'
      - '.github/workflows/four-leg-score-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-four-legs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research kernel
        run: python -m compileall -q research/four_leg_score
      - name: Four direction probability and risk tests
        run: python -m unittest discover -s research/four_leg_score -p 'test_*.py' -v
      - name: Existing observer regression tests
        run: python -m unittest discover -s standalone_web/tests -p 'test_*.py' -v
