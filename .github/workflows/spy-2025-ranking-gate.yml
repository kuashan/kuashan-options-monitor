name: SPY 2025 Four-Leg Ranking Gate
on:
  push:
    branches:
      - research/spy-2025-ranking-gate-v1
    paths:
      - research/four_leg_score/spy_2025_ranking_gate.py
      - research/four_leg_score/test_spy_2025_ranking_gate.py
      - .github/workflows/spy-2025-ranking-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum Parquet dependency
        run: python -m pip install 'duckdb>=1.1,<2'
      - name: Validate rank gate and prior research maths
        run: python -m unittest discover -s research/four_leg_score -p 'test_*.py' -v
      - name: Holdout 2025 ranking gate (no trained weights)
        run: python -m research.four_leg_score.spy_2025_ranking_gate
      - name: Save full no-score experiment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-2025-ranking-gate-result
          path: spy_2025_ranking_gate_result.json
          if-no-files-found: ignore
