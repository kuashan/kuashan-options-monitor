name: Options Monitor ARM64 Image

on:
  push:
    branches:
      - feature/options-monitor-v1-final
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional Yahoo market provider for import compatibility
        run: python -m pip install -r standalone_web/requirements-marketdata.txt 'duckdb>=1.1,<2'
      - name: Four-leg theory, source quality, capital and historical research regression
        run: python -m unittest discover -s research/four_leg_score -p 'test_*.py' -v
      - name: Standalone observer plus four-leg integration and write-denial tests
        run: python -m unittest discover -s standalone_web/tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q standalone_web research/four_leg_score
      - name: Browser JS syntax (without external packages)
        run: node --check standalone_web/static/app.js
      - name: Compose contract
        run: docker compose -f compose.options-monitor.yml config
      - name: No production trading connection
        run: |
          python - <<'PY'
          from standalone_web.option_analysis import LEGS, MODEL
          from standalone_web.server import Handler
          assert set(LEGS) == {"long_call", "long_put", "short_call", "short_put"}
          assert MODEL == "V1_THREE_FACTOR_BOTTLENECK"
          print("OPTIONS_V1_FOUR_LEGS=PASS")
          print("OPTIONS_V1_MODEL_FROZEN=PASS")
          print("OPTIONS_V1_NO_TRADING_API=PASS_BY_TESTS")
          PY
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.options-monitor
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Record immutable image identity
        run: |
          {
            echo "## Options Monitor image"
            echo "SOURCE_HEAD=${GITHUB_SHA}"
            echo "IMAGE=${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo "PLATFORM=linux/arm64"
            echo "DIGEST=${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
