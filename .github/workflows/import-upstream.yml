name: Backup entire upstream and import source
on:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Archive original Git objects and import browsable source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/liuxie066/options-monitor.git upstream.git
          git -C upstream.git fsck --full --no-reflogs
          git -C upstream.git bundle create "$PWD/options-monitor-full-history.bundle" --all
          echo "BUNDLE_BYTES=$(stat -c %s options-monitor-full-history.bundle)"
          echo "SOURCE_BRANCHES=$(git -C upstream.git for-each-ref refs/heads/ --format='%(refname)' | wc -l)"
          echo "SOURCE_TAGS=$(git -C upstream.git for-each-ref refs/tags/ --format='%(refname)' | wc -l)"
          git clone --branch main https://github.com/liuxie066/options-monitor.git upstream
          git clone https://x-access-token:${GH_TOKEN}@github.com/kuashan/kuashan-options-monitor.git backup
          rsync -a --delete --exclude='/.git/' --exclude='/.github/workflows/' --exclude='/upstream-workflows/' upstream/ backup/
          mkdir -p backup/upstream-workflows
          if [ -d upstream/.github/workflows ]; then
            rsync -a upstream/.github/workflows/ backup/upstream-workflows/
          fi
          echo 'Original workflow YAML files are stored here because GITHUB_TOKEN cannot push them to .github/workflows. Complete original history (with original paths) is in the release Git bundle.' > backup/upstream-workflows/README.txt
          git -C backup config user.name 'github-actions[bot]'
          git -C backup config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C backup add -A
          if ! git -C backup diff --cached --quiet; then
            git -C backup commit -m 'backup: import upstream source snapshot and original workflows'
            git -C backup push origin HEAD:main
          fi
          gh release create upstream-preservation-20261008 ./options-monitor-full-history.bundle --repo kuashan/kuashan-options-monitor --title 'Full upstream Git history backup 2026-10-08' --notes 'Complete original Git refs and objects, including all branches, tags, and workflow history. Restore with git clone options-monitor-full-history.bundle recovered-repo.'
          git clone --mirror https://github.com/kuashan/kuashan-options-monitor.git verify.git
          git -C upstream.git bundle verify "$PWD/options-monitor-full-history.bundle"
          test -s options-monitor-full-history.bundle
          echo 'BACKUP_BUNDLE_AND_SOURCE_SNAPSHOT=PASS'
