name: Import upstream Git history
on:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Import references incrementally and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/liuxie066/options-monitor.git upstream.git
          cd upstream.git
          git fsck --full --no-reflogs
          git remote add backup https://x-access-token:${GH_TOKEN}@github.com/kuashan/kuashan-options-monitor.git
          mapfile -t branches < <(git for-each-ref --format='%(refname)' refs/heads/ | grep -v '^refs/heads/main$')
          mapfile -t tags < <(git for-each-ref --format='%(refname)' refs/tags/)
          echo "SOURCE_BRANCHES=$((${#branches[@]}+1)) SOURCE_TAGS=${#tags[@]}"
          for ref in "${branches[@]}" "${tags[@]}"; do
            echo "Pushing $ref"
            git -c http.postBuffer=524288000 push backup "+$ref:$ref"
          done
          git push --force backup '+refs/heads/main:refs/heads/main'
          git ls-remote --heads --tags origin | sort > /tmp/upstream-refs
          git ls-remote --heads --tags backup | sort > /tmp/backup-refs
          diff -u /tmp/upstream-refs /tmp/backup-refs
          echo "MIRROR_REFS_VERIFIED=PASS"
